# Compila la aplicación en cada sistema y publica los ejecutables.
#
#  · A mano:  pestaña Actions → "Compilar aplicación" → Run workflow.
#             Los archivos quedan como "artifacts" de la ejecución.
#  · Release: al empujar una etiqueta (git tag v2.0.0 && git push --tags)
#             se crea la release con los instaladores adjuntos.
name: Compilar aplicación

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construir instalador y portable
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  linux:
    name: Linux (AppImage y .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construir AppImage y .deb
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # La etiqueta puede llegar de dos formas: empujada desde la consola (aquí
      # aún no hay release) o creada desde la web al publicar una release (que
      # ya existe). Se contemplan las dos para no fallar en la segunda.
      - name: Publicar los ejecutables en la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(artifacts/windows/* artifacts/linux/*)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "La release ya existe: adjunto los ejecutables."
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --clobber "${files[@]}"
          else
            echo "Creando la release."
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Comparador de BD ${GITHUB_REF_NAME}" \
              --notes "Ejecutables generados automáticamente desde ${GITHUB_SHA}." \
              "${files[@]}"
          fi
