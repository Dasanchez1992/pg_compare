<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>No se pudo iniciar</title>
    <style>
        :root {
            --bg:#0b1120; --card:#151f31; --card2:#0e1626; --border:#2a3a52;
            --text:#e2e8f0; --dim:#8fa3bd; --accent:#38bdf8; --red:#f87171;
        }
        * { box-sizing:border-box; }
        body {
            margin:0; min-height:100vh; padding:2.5rem 1.5rem;
            font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color:var(--text); background:var(--bg);
            display:flex; align-items:center; justify-content:center;
        }
        .card {
            width:min(720px, 100%); background:var(--card); border:1px solid var(--border);
            border-radius:14px; padding:1.9rem; box-shadow:0 20px 50px -25px rgba(0,0,0,.9);
        }
        h1 { margin:0 0 .5rem; font-size:1.35rem; color:var(--red); }
        p { color:var(--dim); line-height:1.5; margin:.35rem 0 1rem; }
        pre {
            background:var(--card2); border:1px solid var(--border); border-radius:8px;
            padding:.9rem 1rem; max-height:260px; overflow:auto; margin:0 0 1.2rem;
            font-size:.82rem; line-height:1.45; color:var(--dim); white-space:pre-wrap;
        }
        .actions { display:flex; gap:.6rem; flex-wrap:wrap; }
        button {
            font:inherit; font-weight:600; font-size:.92rem; cursor:pointer;
            padding:.55rem 1.1rem; border-radius:8px; border:1px solid var(--border);
            background:var(--card2); color:var(--text); transition:background .15s, border-color .15s;
        }
        button:hover { background:rgba(255,255,255,.06); border-color:var(--accent); }
        button.primary { background:var(--accent); border-color:var(--accent); color:#081321; }
        button.primary:hover { filter:brightness(1.08); }
        .path { font-size:.78rem; color:var(--dim); margin-top:1rem; word-break:break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h1>No se pudo iniciar el comparador</h1>
        <p id="message">El servidor local no respondió.</p>
        <pre id="log">Sin detalles.</pre>
        <div class="actions">
            <button class="primary" id="retry">Reintentar</button>
            <button id="open-log">Ver registro completo</button>
            <button id="quit">Salir</button>
        </div>
        <div class="path" id="log-path"></div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        async function render() {
            const info = await window.pgcompare.startupError();
            if (!info) return;
            $('message').textContent = info.message || 'Error desconocido.';
            $('log').textContent = info.log || 'Sin detalles en el registro.';
            $('log-path').textContent = info.logPath ? 'Registro: ' + info.logPath : '';
        }

        $('retry').addEventListener('click', async (event) => {
            event.target.disabled = true;
            event.target.textContent = 'Reintentando…';
            await window.pgcompare.retry();
            await render();
            event.target.disabled = false;
            event.target.textContent = 'Reintentar';
        });
        $('open-log').addEventListener('click', () => window.pgcompare.openLog());
        $('quit').addEventListener('click', () => window.pgcompare.quit());

        render();
    </script>
</body>
</html>
