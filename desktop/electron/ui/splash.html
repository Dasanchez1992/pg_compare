<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
    <title>Iniciando…</title>
    <style>
        :root { --bg:#0b1120; --text:#e2e8f0; --dim:#8fa3bd; --accent:#38bdf8; --border:#2a3a52; }
        * { box-sizing:border-box; }
        body {
            margin:0; height:100vh; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:1.4rem;
            font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color:var(--text); user-select:none;
            background:
                radial-gradient(900px 420px at 85% -10%, rgba(56,189,248,.10), transparent 60%),
                radial-gradient(700px 380px at -10% 0%, rgba(52,211,153,.06), transparent 60%),
                var(--bg);
        }
        .logo {
            width:4.4rem; height:4.4rem; border-radius:18px; font-size:2.2rem;
            display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, var(--accent), #6366f1);
            box-shadow:0 18px 40px -18px rgba(56,189,248,.8);
        }
        h1 { margin:0; font-size:1.3rem; letter-spacing:-.01em; }
        p { margin:0; color:var(--dim); font-size:.92rem; }
        .bar {
            width:230px; height:4px; border-radius:99px; overflow:hidden;
            background:var(--border); position:relative;
        }
        .bar::after {
            content:""; position:absolute; inset:0 auto 0 0; width:40%;
            border-radius:99px; background:linear-gradient(90deg, var(--accent), #6366f1);
            animation:slide 1.25s ease-in-out infinite;
        }
        @keyframes slide {
            0%   { left:-40%; }
            100% { left:100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bar::after { animation:none; left:0; width:100%; opacity:.6; }
        }
    </style>
</head>
<body>
    <div class="logo">🗄️</div>
    <h1>Comparador de BD</h1>
    <div class="bar"></div>
    <p>Preparando la base interna y el servidor local…</p>
</body>
</html>
